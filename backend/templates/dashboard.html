<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectGram | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        :root {
            --primary-blue: #007BFF;
            --hover-blue: #0056b3;
            --bg-pink: #FDE2E4;
            --text-dark: #333;
            --text-gray: #666;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-pink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dashboard-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 {
            color: var(--text-dark);
            font-size: 24px;
            margin-bottom: 25px;
        }

        /* Stats Section */
        .stats-card {
            background: #ffffff; 
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 3px solid #005ed9;
            transition: transform 0.2s;
        }

        .stats-card:hover {
            transform: translateY(-3px);
        }

        .stats-count {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-blue);
        }

        .stats-label {
            font-size: 13px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* Menu Buttons */
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-links a {
            text-decoration: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: var(--hover-blue);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
            transform: scale(1.02);
        }

        /* Logout Button Specifics */
        .logout-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn-logout {
            background-color: #ff4757;
            width: auto;
            display: inline-flex;
            padding: 10px 25px;
        }

        .btn-logout:hover {
            background-color: #e84118;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .logout-icon {
            width: 18px;
            filter: brightness(0) invert(1);
        }

    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>Welcome, {{ user.username }}!</h1>

        <div class="stats-card">
            <span class="stats-label">Followers</span>
            <span class="stats-count">{{ user.followers }}</span>
        </div>
        
        <div class="menu-links">
            <a href="post.html">
                <button class="btn"><i class="fa fa-plus-circle"></i> NEW POST</button>
            </a>
            
            <a href="/feed.html">
                <button class="btn"><i class="fa fa-home"></i> MAIN FEED</button>
            </a>

            <a href="/Follow pagee.html">
                <button class="btn"><i class="fa fa-user-plus"></i> FIND FRIENDS</button>
            </a>

            <a href="/Messaging page.html">
                <button class="btn"><i class="fa fa-envelope"></i> MESSAGES</button>
            </a>
        </div>
        
        <div class="logout-container">
            <a href="/logout">
                <button class="btn btn-logout">
                    <i class="fa fa-sign-out"></i> Logout
                </button>
            </a>
        </div>
    </div>

</body>
</html>
